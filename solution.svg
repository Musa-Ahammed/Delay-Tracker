<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" style="max-width:100%;height:auto" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Delay Tracker: a clearer experience when food runs late</title><desc id="desc">A proposed Pathao Food feature that shows confirmed delay information, identifies stale updates, and provides support with context. Request approval for discovery and a measured pilot.</desc><rect width="1600" height="900" fill="#f7f8f3"/><g font-family="Arial,Helvetica,sans-serif">
<rect x="62" y="47" width="32" height="32" rx="10" fill="#e93043"/><text x="71" y="71" font-size="28" font-style="italic" font-weight="700" fill="white">p</text><text x="108" y="69" font-size="16" fill="#203b32" font-weight="700">PATHAO FOOD / INDEPENDENT CONCEPT</text><text x="1365" y="69" font-size="14" fill="#6f8065">MAHIN · Q4</text>
<text x="62" y="153" font-size="61" fill="#203b32" font-weight="700" letter-spacing="-2">Food runs late.</text><text x="62" y="220" font-size="61" fill="#738b5f" font-weight="700" letter-spacing="-2">Clarity shouldn't.</text><text x="62" y="263" font-size="22" fill="#657660">Delay Tracker: understand the wait. Know what to do next.</text>
<line x1="62" y1="301" x2="1538" y2="301" stroke="#dce4d5"/>
<text x="62" y="352" font-size="14" letter-spacing="2" fill="#6e855e" font-weight="700">ONE MOMENT / A LATE FOOD ORDER</text>
<g fill="#203b32"><text x="110" y="401" font-size="24" font-weight="700">Make the delay understandable.</text><text x="110" y="434" font-size="19" fill="#6c7a64">Show the reason, its source, and the revised arrival range.</text><text x="110" y="490" font-size="24" font-weight="700">Make uncertainty visible.</text><text x="110" y="523" font-size="19" fill="#6c7a64">If an update is missed, label the old estimate as unconfirmed.</text><text x="110" y="579" font-size="24" font-weight="700">Make the next action easy.</text><text x="110" y="612" font-size="19" fill="#6c7a64">Offer support with the order and delay details attached.</text></g>
<g fill="#e7eddf"><circle cx="79" cy="396" r="17"/><circle cx="79" cy="485" r="17"/><circle cx="79" cy="574" r="17"/></g><g fill="#6b8556" font-size="13" text-anchor="middle" font-weight="700"><text x="79" y="401">1</text><text x="79" y="490">2</text><text x="79" y="579">3</text></g>
<rect x="62" y="657" width="748" height="171" rx="17" fill="#eaf0e3"/><text x="85" y="691" fill="#4c6c3f" font-size="14" font-weight="700" letter-spacing="1">APPROVE DISCOVERY + A SMALL PILOT</text><text x="85" y="727" fill="#314e2d" font-size="23" font-weight="700">Less uncertainty. Fewer avoidable enquiries.</text><text x="85" y="762" fill="#5e7452" font-size="18">Measure support contacts per delayed order against a control.</text><text x="85" y="793" fill="#5e7452" font-size="17">Guardrails: ETA accuracy, satisfaction, cancellations, access to help.</text>
<g transform="translate(900 150) scale(0.915)">
<rect width="350" height="740" rx="44" fill="#273d33"/>
<rect x="8" y="8" width="334" height="724" rx="36" fill="#fff"/>
<text x="25" y="35" font-size="11" font-weight="700" fill="#203b32">7:36</text>
<rect x="134" y="16" width="82" height="20" rx="10" fill="#273d33"/>
<rect x="305" y="25" width="15" height="7" rx="2" fill="#273d33"/>
<circle cx="38" cy="76" r="14" fill="#f1f4ed"/><text x="33" y="83" font-size="22" fill="#203b32">‹</text>
<text x="60" y="82" fill="#203b32" font-size="17" font-weight="700">Delay tracker</text>
<rect x="237" y="63" width="89" height="25" rx="13" fill="#faebe7"/><text x="246" y="80" fill="#9f4239" font-size="9" font-weight="700">Update overdue</text>
<text x="25" y="133" fill="#7b8874" font-size="9" letter-spacing=".5">DELIVERY ESTIMATE NEEDS AN UPDATE</text>
<text x="25" y="165" fill="#87594d" font-size="21" font-weight="700">Waiting for a fresh estimate</text>
<text x="25" y="190" fill="#7b8874" font-size="10">Last estimate: 7:45–7:50 PM · not reconfirmed</text>
<rect x="25" y="214" width="300" height="128" rx="12" fill="#fff" stroke="#e1e7dc"/>
<text x="39" y="242" fill="#203b32" font-size="13" font-weight="700">Last known reason</text>
<text x="39" y="268" fill="#697b5e" font-size="12">The restaurant previously reported a kitchen</text>
<text x="39" y="288" fill="#697b5e" font-size="12">backlog. We have no newer confirmation.</text>
<text x="39" y="320" fill="#819075" font-size="10">Last restaurant status</text><text x="311" y="320" text-anchor="end" fill="#819075" font-size="10">7:28 PM</text>
<rect x="25" y="357" width="300" height="39" rx="9" fill="#fff1e8"/>
<text x="39" y="382" fill="#95614e" font-size="11">7:35 PM check</text><text x="311" y="382" text-anchor="end" fill="#95614e" font-size="11" font-weight="700">No new status</text>
<text x="25" y="420" fill="#7b8874" font-size="10">We have not received a reliable new estimate.</text><text x="25" y="437" fill="#7b8874" font-size="10">You can ask for help below.</text>
<text x="25" y="479" fill="#203b32" font-size="12" font-weight="700">Keep me updated</text><text x="25" y="499" fill="#819075" font-size="10">Alerts when the order status changes.</text>
<rect x="283" y="466" width="42" height="25" rx="13" fill="#527c47"/><circle cx="312" cy="478.5" r="9.5" fill="#fff"/>
<rect x="25" y="529" width="300" height="44" rx="10" fill="#e93043"/>
<text x="175" y="556" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">Ask for an order update →</text>
<text x="25" y="597" fill="#859176" font-size="10">Your order and delay details are attached automatically.</text>
<rect x="121" y="718" width="108" height="4" rx="2" fill="#273d33"/>
</g>
<text x="1280" y="365" fill="#6e855e" font-size="13" font-weight="700" letter-spacing="1.5">WHY IT MATTERS</text><text x="1280" y="404" fill="#203b32" font-size="22" font-weight="700"><tspan x="1280">An old estimate</tspan><tspan x="1280" dy="30">is not a new</tspan><tspan x="1280" dy="30">promise.</tspan></text><text x="1280" y="520" fill="#6d7e64" font-size="17"><tspan x="1280">Customers can judge</tspan><tspan x="1280" dy="26">what is known and</tspan><tspan x="1280" dy="26">get help when it isn't.</tspan></text>
<text x="1280" y="649" fill="#6e855e" font-size="13" font-weight="700" letter-spacing="1.5">START SMALL</text><text x="1280" y="685" fill="#6d7e64" font-size="17"><tspan x="1280">Preparation delays.</tspan><tspan x="1280" dy="26">Reliable event data.</tspan><tspan x="1280" dy="26">A measured rollout.</tspan></text>
<text x="62" y="870" fill="#7e8c73" font-size="13">Sample scenario · Proposed benefits require validation · Current-app comparison not yet completed · Not affiliated with Pathao</text></g></svg>
